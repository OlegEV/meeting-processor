services:
  # Веб-сервис для обработки встреч
  meeting-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: meeting-processor-web
    ports:
      - "8001:8000"
    volumes:
      - ./logs:/app/logs
      - ./web_uploads:/app/web_uploads
      - ./web_output:/app/web_output
      - ./temp_files:/app/temp_files
      - ./meeting_processor.db:/app/meeting_processor.db
      - ./config.json:/app/config.json:ro
      - ./templates_config.json:/app/templates_config.json:ro
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
      # PostgreSQL вместо SQLite: задайте DATABASE_URL в .env (см. POSTGRESQL_README.md).
      # Пустое значение оставляет SQLite из config.json.
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - FLASK_ENV=production
      - AUTH_TOKEN_HEADER=X-Identity-Token
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - meeting-network

  # PostgreSQL (опционально): запускается только с профилем postgres
  #   docker-compose --profile postgres up -d
  # и DATABASE_URL=postgresql://meeting:<пароль>@postgres:5432/meeting_processor в .env
  postgres:
    image: postgres:16-alpine
    container_name: meeting-processor-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=meeting_processor
      - POSTGRES_USER=meeting
      # Без пароля контейнер PostgreSQL не запустится — задайте POSTGRES_PASSWORD в .env
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_processor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting-network

networks:
  meeting-network:
    driver: bridge

volumes:
  logs:
    driver: local
  postgres_data:
    driver: local
